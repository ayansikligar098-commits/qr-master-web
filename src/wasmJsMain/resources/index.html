    <style>
        /* Full-page drag & drop overlay (shell level — the Compose canvas
           cannot receive HTML5 drop events, so the shell owns this). */
        #qm-drop-overlay {
            display: none;
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(124, 58, 237, 0.10);
            pointer-events: none;
        }
        #qm-drop-overlay .qm-drop-box {
            position: absolute; inset: 22px;
            border: 3px dashed #7C3AED; border-radius: 22px;
            background: rgba(255, 255, 255, 0.88);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #5B21B6; font-size: 26px; font-weight: 700;
            text-align: center; padding: 24px;
        }

        /* Adsterra banners (shell level — the Compose UI is untouched).
           The app is mounted into #qm-app, which fills everything above
           the ad strip; closing the bar gives the space back. */
        /* Top banner bar (Ayan's order, 25 Nov 2026): the bar sits ABOVE
           the app and pushes it down — it never covers the website.
           Closing it (x) sets --qm-ad-h to 0 and the app takes the
           full height back. */
        :root { --qm-ad-h: 106px; }
        @media (max-width: 760px) { :root { --qm-ad-h: 64px; } }
        #qm-app {
            position: fixed; left: 0; right: 0;
            top: var(--qm-ad-h); bottom: 0;
        }
        html.qm-ads-off { --qm-ad-h: 0px; }
        html.qm-ads-off #qm-adbar { display: none; }
        #qm-adbar {
            position: fixed; left: 0; right: 0; top: 0;
            height: var(--qm-ad-h);
            background: #ffffff; border-bottom: 1px solid #E5E0F5;
            box-shadow: 0 2px 12px rgba(60, 20, 120, 0.08);
            display: flex; align-items: center; justify-content: center;
            z-index: 99990;
        }
        #qm-ad-slot { line-height: 0; max-width: 100vw; overflow: hidden; }
        .qm-ad-close {
            position: absolute; top: 2px; right: 6px;
            width: 22px; height: 22px; border: none; border-radius: 50%;
            background: rgba(91, 33, 182, 0.08); color: #5B21B6;
            font-size: 15px; line-height: 22px; text-align: center;
            cursor: pointer; padding: 0; z-index: 2;
        }
        .qm-ad-close:hover { background: rgba(91, 33, 182, 0.18); }
        #qm-native-card {
            position: fixed; right: 12px;
            bottom: 12px;
            width: min(350px, calc(100vw - 24px));
            max-height: min(430px, 60vh); overflow-y: auto;
            background: #ffffff; border: 1px solid #E5E0F5; border-radius: 12px;
            box-shadow: 0 8px 28px rgba(60, 20, 120, 0.16);
            z-index: 99990; padding: 20px 10px 10px;
        }
        #qm-native-card img, #qm-native-card iframe, #qm-native-card > div { max-width: 100% !important; }
        @media (max-width: 760px) { #qm-native-card { display: none; } }
        html.qm-native-off #qm-native-card { display: none; }
        .qm-ad-label {
            position: absolute; top: 5px; left: 12px;
            font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px;
            letter-spacing: 0.08em; text-transform: uppercase; color: #9B93B8;
        }
        #qm-native-card .qm-ad-close { top: 4px; right: 6px; }
    </style>
    <script>
    // ── QR Master shell tool bridges ─────────────────────────────────────
    // The Compose Wasm canvas cannot receive HTML5 file drops and cannot
    // run the heavy JS tool libraries directly, so the shell owns:
    //   1) a unified File registry (picked + dropped files, bytes on demand)
    //   2) document-level drag & drop with a DOM overlay
    //   3) lazy-loaded pdf-lib / pdf.js / background-removal helpers
    // All async results are delivered through window.__qmAsync[key] as JSON
    // strings, which the Kotlin side polls (same pattern as Google sign-in).
    window.__qmAsync = {};
    window.__qmFiles = {};        // id -> File
    window.__qmFileSeq = 0;
    window.__qmPickedQ = [];      // metadata JSON strings
    window.__qmDroppedQ = [];     // metadata JSON strings

    function qmRegisterFile(f, queue) {
        window.__qmFileSeq += 1;
        var id = 'f' + window.__qmFileSeq;
        window.__qmFiles[id] = f;
        queue.push(JSON.stringify({ id: id, name: f.name || 'file', type: f.type || '', size: f.size || 0 }));
        return id;
    }

    // ── Drag & drop (document level) ─────────────────────────────────────
    (function () {
        var dragDepth = 0;
        function overlay() { return document.getElementById('qm-drop-overlay'); }
        function hasFiles(e) {
            try {
                var t = e.dataTransfer && e.dataTransfer.types;
                if (!t) return false;
                for (var i = 0; i < t.length; i++) if (t[i] === 'Files') return true;
            } catch (err) {}
            return false;
        }
        document.addEventListener('dragenter', function (e) {
            e.preventDefault();
            if (!hasFiles(e)) return;
            dragDepth++;
            var o = overlay(); if (o) o.style.display = 'block';
        });
        document.addEventListener('dragover', function (e) {
            e.preventDefault(); // never let the browser open the file
            if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        });
        document.addEventListener('dragleave', function (e) {
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) { var o = overlay(); if (o) o.style.display = 'none'; }
        });
        document.addEventListener('drop', function (e) {
            e.preventDefault();
            dragDepth = 0;
            var o = overlay(); if (o) o.style.display = 'none';
            var files = (e.dataTransfer && e.dataTransfer.files) || [];
            for (var i = 0; i < files.length; i++) qmRegisterFile(files[i], window.__qmDroppedQ);
        });
        window.addEventListener('dragend', function () {
            dragDepth = 0;
            var o = overlay(); if (o) o.style.display = 'none';
        });
    })();

    // ── Paste (opt-in per tool) ──────────────────────────────────────────
    // A tool that accepts pasted images sets window.__qmPasteArmed = true
    // while it is on screen; pasted files then land in the same registry
    // + dropped queue as drag & drop, so validation stays identical.
    window.__qmPasteArmed = false;
    document.addEventListener('paste', function (e) {
        if (!window.__qmPasteArmed) return;
        var files = (e.clipboardData && e.clipboardData.files) || [];
        if (!files.length) return;
        e.preventDefault();
        for (var i = 0; i < files.length; i++) qmRegisterFile(files[i], window.__qmDroppedQ);
    });

    // ── Fetch a same-origin resource as a data URL (per-call async key) ──
    // Used by the app to fetch same-origin assets as data URLs.
    window.__qmFetchDataUrl = function (url, key) {
        window.__qmAsync[key] = '';
        fetch(url).then(function (r) {
            if (!r.ok) throw new Error('Could not load ' + url);
            return r.blob();
        }).then(function (blob) {
            var rd = new FileReader();
            rd.onload = function () { qmSetAsync(key, { ok: true, dataUrl: String(rd.result || '') }); };
            rd.onerror = function () { qmSetAsync(key, { ok: false, error: 'Could not read ' + url }); };
            rd.readAsDataURL(blob);
        }).catch(function (e) {
            qmSetAsync(key, { ok: false, error: (e && e.message) ? e.message : ('' + e) });
        });
    };

    // ── Lazy script loader ───────────────────────────────────────────────
    window.__qmLibState = {}; // name -> 'loading' | 'ready' | 'error:...'
    function qmLoadScript(name, url) {
        if (window.__qmLibState[name] === 'ready' || window.__qmLibState[name] === 'loading') return;
        window.__qmLibState[name] = 'loading';
        var s = document.createElement('script');
        s.src = url;
        s.onload = function () { window.__qmLibState[name] = 'ready'; };
        s.onerror = function () { window.__qmLibState[name] = 'error:Could not load ' + name + '. Check your connection.'; };
        document.head.appendChild(s);
    }
    window.__qmLoadPdfLibs = function () {
        qmLoadScript('pdflib', 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');
        qmLoadScript('pdfjs', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
    };
    window.__qmLibStatus = function () {
        var a = window.__qmLibState['pdflib'] || 'idle';
        var b = window.__qmLibState['pdfjs'] || 'idle';
        if (a.indexOf('error') === 0) return a;
        if (b.indexOf('error') === 0) return b;
        if (a === 'ready' && b === 'ready') {
            try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; } catch (e) {}
            return 'ready';
        }
        return 'loading';
    };

    // ── Razorpay Checkout bridge ─────────────────────────────────────────
    // Same poll pattern as Google sign-in: the Kotlin side starts the
    // checkout with a JSON options string and polls window.__qmRzp for the
    // outcome. States: paid {paymentId, rzpOrderId, signature} | failed
    // {message} | dismissed | error {message}. The grant itself happens
    // ONLY on the server after /v1/payments/verify — this bridge just
    // collects the checkout result.
    window.__qmOpenRazorpay = function (optsJson) {
        window.__qmRzp = '';
        function fail(msg) { window.__qmRzp = JSON.stringify({ state: 'error', message: msg }); }
        function start() {
            try {
                var o = JSON.parse(optsJson);
                var rzp = new Razorpay({
                    key: o.key,
                    amount: o.amount,
                    currency: o.currency || 'INR',
                    name: 'Kitnook',
                    description: o.description || 'Kitnook payment',
                    order_id: o.order_id,
                    prefill: o.prefill || {},
                    theme: { color: '#6D28D9' },
                    handler: function (resp) {
                        window.__qmRzp = JSON.stringify({
                            state: 'paid',
                            paymentId: resp.razorpay_payment_id || '',
                            rzpOrderId: resp.razorpay_order_id || '',
                            signature: resp.razorpay_signature || ''
                        });
                    },
                    modal: {
                        ondismiss: function () {
                            if (!window.__qmRzp) {
                                window.__qmRzp = JSON.stringify({ state: 'dismissed' });
                            }
                        }
                    }
                });
                rzp.on('payment.failed', function (resp) {
                    var d = (resp && resp.error && resp.error.description) || 'Payment failed. Please try again.';
                    window.__qmRzp = JSON.stringify({ state: 'failed', message: d });
                });
                rzp.open();
            } catch (e) {
                fail('Could not open the payment window. Please try again.');
            }
        }
        if (typeof Razorpay !== 'undefined') { start(); return; }
        qmLoadScript('razorpay', 'https://checkout.razorpay.com/v1/checkout.js');
        var waited = 0;
        var iv = setInterval(function () {
            waited += 200;
            if (typeof Razorpay !== 'undefined') { clearInterval(iv); start(); }
            else if ((window.__qmLibState['razorpay'] || '').indexOf('error') === 0) {
                clearInterval(iv);
                fail('Could not load the payment page. Check your connection and try again.');
            } else if (waited > 20000) {
                clearInterval(iv);
                fail('The payment page took too long to load. Please try again.');
            }
        }, 200);
    };

    function qmB64ToBytes(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }
    function qmBytesToB64(bytes) {
        var bin = '';
        var CH = 0x8000;
        for (var i = 0; i < bytes.length; i += CH) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
        }
        return btoa(bin);
    }
    function qmSetAsync(key, obj) { window.__qmAsync[key] = JSON.stringify(obj); }

    // ── PDF operations (pdf-lib / pdf.js) ────────────────────────────────
    window.__qmPdfOp = function (op, argsJson, key) {
        key = key || 'pdf';
        window.__qmAsync[key] = '';
        (async function () {
            try {
                var args = JSON.parse(argsJson || '{}');
                if (typeof PDFLib === 'undefined') throw new Error('PDF library is still loading. Try again in a moment.');
                var PDFDocument = PDFLib.PDFDocument;
                if (op === 'count') {
                    var doc = await PDFDocument.load(qmB64ToBytes(args.pdf), { ignoreEncryption: true });
                    qmSetAsync(key, { ok: true, pages: doc.getPageCount() });
                } else if (op === 'merge') {
                    var out = await PDFDocument.create();
                    for (var i = 0; i < args.pdfs.length; i++) {
                        var src = await PDFDocument.load(qmB64ToBytes(args.pdfs[i]), { ignoreEncryption: true });
                        var pages = await out.copyPages(src, src.getPageIndices());
                        pages.forEach(function (p) { out.addPage(p); });
                    }
                    var bytes = await out.save();
                    qmSetAsync(key, { ok: true, b64: qmBytesToB64(bytes), pages: out.getPageCount() });
                } else if (op === 'extract') {
                    var sdoc = await PDFDocument.load(qmB64ToBytes(args.pdf), { ignoreEncryption: true });
                    var total = sdoc.getPageCount();
                    var want = (args.pages || []).filter(function (p) { return p >= 1 && p <= total; });
                    if (!want.length) throw new Error('No valid pages selected.');
                    var odoc = await PDFDocument.create();
                    var copied = await odoc.copyPages(sdoc, want.map(function (p) { return p - 1; }));
                    copied.forEach(function (p) { odoc.addPage(p); });
                    var obytes = await odoc.save();
                    qmSetAsync(key, { ok: true, b64: qmBytesToB64(obytes), pages: odoc.getPageCount() });
                } else if (op === 'rotate') {
                    var rdoc = await PDFDocument.load(qmB64ToBytes(args.pdf), { ignoreEncryption: true });
                    var angle = args.angle || 90;
                    rdoc.getPages().forEach(function (p) {
                        var cur = p.getRotation().angle || 0;
                        p.setRotation(PDFLib.degrees((cur + angle) % 360));
                    });
                    var rbytes = await rdoc.save();
                    qmSetAsync(key, { ok: true, b64: qmBytesToB64(rbytes), pages: rdoc.getPageCount() });
                } else if (op === 'nup') {
                    // N-Up Print: pack 2 or 4 source pages onto each A4 sheet
                    // (2-up = one column of two, 4-up = 2x2 grid). Pages are
                    // embedded as vectors, so print stays sharp; nothing is
                    // rasterised. A 10 mm margin is kept on every sheet.
                    var nsrc = await PDFDocument.load(qmB64ToBytes(args.pdf), { ignoreEncryption: true });
                    var nper = (args.perSheet === 4) ? 4 : 2;
                    var ncols = (nper === 4) ? 2 : 1, nrows = 2;
                    var nout = await PDFDocument.create();
                    var ntotal = nsrc.getPageCount();
                    var A4W = 595.28, A4H = 841.89, NM = 28;
                    var cellW = (A4W - NM * 2) / ncols, cellH = (A4H - NM * 2) / nrows;
                    for (var ns = 0; ns < ntotal; ns += nper) {
                        var npage = nout.addPage([A4W, A4H]);
                        for (var nk = 0; nk < nper && ns + nk < ntotal; nk++) {
                            var nsp = nsrc.getPage(ns + nk);
                            var nemb = await nout.embedPage(nsp);
                            var nrot = nsp.getRotation().angle || 0;
                            var new_ = ((nrot === 90 || nrot === 270) ? nemb.height : nemb.width);
                            var neh = ((nrot === 90 || nrot === 270) ? nemb.width : nemb.height);
                            var nsc = Math.min(cellW / new_, cellH / neh);
                            var nw = new_ * nsc, nh = neh * nsc;
                            var ncol = nk % ncols, nrow = Math.floor(nk / ncols);
                            var nx = NM + ncol * cellW + (cellW - nw) / 2;
                            var ny = A4H - NM - nrow * cellH - (cellH - nh) / 2 - nh;
                            npage.drawPage(nemb, { x: nx, y: ny, width: nw, height: nh });
                        }
                    }
                    var nbytes = await nout.save();
                    qmSetAsync(key, { ok: true, b64: qmBytesToB64(nbytes), pages: nout.getPageCount(), sourcePages: ntotal, perSheet: nper });
                } else if (op === 'resave') {
                    var cdoc = await PDFDocument.load(qmB64ToBytes(args.pdf), { ignoreEncryption: true });
                    var cbytes = await cdoc.save({ useObjectStreams: true });
                    qmSetAsync(key, { ok: true, b64: qmBytesToB64(cbytes), pages: cdoc.getPageCount(), before: args.pdf.length, after: qmBytesToB64(cbytes).length });
                } else if (op === 'imagesToPdf') {
                    var idoc = await PDFDocument.create();
                    for (var j = 0; j < args.images.length; j++) {
                        var im = args.images[j];
                        var img = (im.mime && im.mime.indexOf('png') >= 0)
                            ? await idoc.embedPng(qmB64ToBytes(im.b64))
                            : await idoc.embedJpg(qmB64ToBytes(im.b64));
                        var scale = Math.min(1, 842 / Math.max(img.width, img.height));
                        var page = idoc.addPage([img.width * scale, img.height * scale]);
                        page.drawImage(img, { x: 0, y: 0, width: img.width * scale, height: img.height * scale });
                    }
                    var ibytes = await idoc.save();
                    qmSetAsync(key, { ok: true, b64: qmBytesToB64(ibytes), pages: idoc.getPageCount() });
                } else if (op === 'imagePage') {
                    // One image filling one page of an exact physical size
                    // (page size in PDF points) — the print-sheet PDF, so a
                    // 4x6 / A4 sheet prints at true size.
                    var pdoc = await PDFDocument.create();
                    var pimg = (args.mime && args.mime.indexOf('png') >= 0)
                        ? await pdoc.embedPng(qmB64ToBytes(args.b64))
                        : await pdoc.embedJpg(qmB64ToBytes(args.b64));
                    var ppage = pdoc.addPage([args.wPt, args.hPt]);
                    ppage.drawImage(pimg, { x: 0, y: 0, width: args.wPt, height: args.hPt });
                    var pbytes = await pdoc.save();
                    qmSetAsync(key, { ok: true, b64: qmBytesToB64(pbytes), pages: 1 });
                } else if (op === 'renderPage') {
                    if (typeof pdfjsLib === 'undefined') throw new Error('PDF viewer library is still loading. Try again in a moment.');
                    var rp = await qmEditorRenderPage(args.pdf, args.page || 1, args.scale || 1.6, args.rotation || 0);
                    qmSetAsync(key, { ok: true, pages: rp.pages, image: rp.image, pw: rp.pw, ph: rp.ph });
                } else if (op === 'render') {
                    if (typeof pdfjsLib === 'undefined') throw new Error('PDF viewer library is still loading. Try again in a moment.');
                    var pdf = await qmGetJsDoc(args.pdf);
                    var n = Math.min(pdf.numPages, args.maxPages || 20);
                    var urls = [];
                    for (var k = 1; k <= n; k++) {
                        var pg = await pdf.getPage(k);
                        var vp = pg.getViewport({ scale: args.scale || 1.6 });
                        var cv = document.createElement('canvas');
                        cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
                        await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
                        urls.push(cv.toDataURL('image/png'));
                    }
                    qmSetAsync(key, { ok: true, pages: pdf.numPages, images: urls });
                } else if (op === 'appendTo') {
                    // Append every page of pdf2 to pdf (the PDF Editor's
                    // "Add pages from another PDF": the combined document
                    // becomes the editor's new single source).
                    var adoc = await PDFDocument.load(qmB64ToBytes(args.pdf), { ignoreEncryption: true });
                    var bdoc = await PDFDocument.load(qmB64ToBytes(args.pdf2), { ignoreEncryption: true });
                    var fromIdx = adoc.getPageCount();
                    var acp = await adoc.copyPages(bdoc, bdoc.getPageIndices());
                    acp.forEach(function (p) { adoc.addPage(p); });
                    var abytes2 = await adoc.save();
                    qmSetAsync(key, { ok: true, b64: qmBytesToB64(abytes2), pages: adoc.getPageCount(), from: fromIdx, added: bdoc.getPageCount() });
                } else if (op === 'formFields') {
                    var ffdoc = await PDFDocument.load(qmB64ToBytes(args.pdf), { ignoreEncryption: true });
                    var ffields = [];
                    try {
                        var fform = ffdoc.getForm();
                        fform.getFields().forEach(function (f) {
                            var item = { name: f.getName(), type: 'other', value: '', options: [] };
                            if (f instanceof PDFLib.PDFTextField) { item.type = 'text'; item.value = f.getText() || ''; }
                            else if (f instanceof PDFLib.PDFCheckBox) { item.type = 'checkbox'; item.value = f.isChecked() ? 'true' : 'false'; }
                            else if (f instanceof PDFLib.PDFRadioGroup) { item.type = 'radio'; item.value = f.getSelected() || ''; item.options = f.getOptions(); }
                            else if (f instanceof PDFLib.PDFDropdown) { item.type = 'dropdown'; var ds = f.getSelected(); item.value = (ds && ds.length) ? ds[0] : ''; item.options = f.getOptions(); }
                            else if (f instanceof PDFLib.PDFOptionList) { item.type = 'dropdown'; var os2 = f.getSelected(); item.value = (os2 && os2.length) ? os2[0] : ''; item.options = f.getOptions(); }
                            else if (f instanceof PDFLib.PDFSignature) { item.type = 'signature'; }
                            else if (f instanceof PDFLib.PDFButton) { item.type = 'button'; }
                            ffields.push(item);
                        });
                    } catch (e) { /* a PDF without a form yields an empty list */ }
                    qmSetAsync(key, { ok: true, fields: ffields, pages: ffdoc.getPageCount() });
                } else if (op === 'watermarkPdf') {
                    var wdoc = await PDFDocument.load(qmB64ToBytes(args.pdf), { ignoreEncryption: true });
                    var wtxt = (args.text || '').trim();
                    if (!wtxt) throw new Error('Enter the watermark text first.');
                    var wpng = qmTextPng(wtxt, 54, args.color || '#7C3AED', true, -30,
                        args.opacity == null ? 0.16 : args.opacity);
                    if (!wpng) throw new Error('The watermark could not be rendered.');
                    var wimg2 = await wdoc.embedPng(wpng.dataUrl);
                    wdoc.getPages().forEach(function (pg) {
                        var sz = pg.getSize();

                        ctx.fillStyle = grad;
                        ctx.fillRect(0, 0, cv.width, cv.height);
                    } else if (args.bg) { ctx.fillStyle = args.bg; ctx.fillRect(0, 0, cv.width, cv.height); }
                    ctx.drawImage(img, args.cropX, args.cropY, args.cropW, args.cropH, 0, 0, args.outW, args.outH);
                    if ((args.brightness != null && args.brightness !== 1) ||
                        (args.contrast != null && args.contrast !== 1) ||
                        (args.saturation != null && args.saturation !== 1)) {
                        var id = ctx.getImageData(0, 0, cv.width, cv.height);
                        qmAdjustPixels(id.data, args.brightness, args.contrast, args.saturation);
                        ctx.putImageData(id, 0, 0);
                    }
                    if (args.sharpness != null && args.sharpness > 0) {
                        qmSharpen(ctx, cv.width, cv.height, args.sharpness);
                    }
                    qmSetAsync(key, {
                        ok: true,
                        dataUrl: qmSetDpi300(cv.toDataURL(args.mime || 'image/png', args.quality || 0.92), args.mime || 'image/png'),
                        w: args.outW, h: args.outH
                    });
                } else if (op === 'renderSheet') {
                    var photo = await qmLoadImage(args.photoDataUrl);
                    var sc = document.createElement('canvas');
                    sc.width = args.paperW; sc.height = args.paperH;
                    var sctx = sc.getContext('2d');
                    sctx.fillStyle = '#ffffff';
                    sctx.fillRect(0, 0, sc.width, sc.height);
                    var cells = args.cells || [];
                    for (var i = 0; i < cells.length; i++) {
                        var cell = cells[i];
                        sctx.drawImage(photo, cell.x, cell.y, cell.w, cell.h);
                        // Cutting guide: a clearly visible thin outline
                        // around every photo (the old 1px 18%-black line
                        // was effectively invisible on the printout).
                        sctx.strokeStyle = 'rgba(0,0,0,0.55)';
                        sctx.lineWidth = 2;
                        sctx.strokeRect(cell.x + 1, cell.y + 1, cell.w - 2, cell.h - 2);
                    }
                    qmSetAsync(key, {
                        ok: true,
                        dataUrl: qmSetDpi300(sc.toDataURL(args.mime || 'image/jpeg', args.quality || 0.92), args.mime || 'image/jpeg'),
                        w: args.paperW, h: args.paperH, count: cells.length
                    });
                } else {
                    throw new Error('Unknown passport operation.');
                }
            } catch (e) {
                qmSetAsync(key, { ok: false, error: (e && e.message) ? e.message : ('' + e) });
            }
        })();
    };
    </script>
    <script type="application/javascript" src="qrmaster.js"></script>
</head>
<body>
<div id="qm-app"></div>
<div id="qm-drop-overlay"><div class="qm-drop-box">Drop files here to add them</div></div>

<!-- Adsterra — TOP banner bar (728x90 desktop / 320x50 mobile).
     Only the size matching the screen is loaded. Placement IDs:
     728x90 = 32440132, 320x50 = 32440131. The bar reserves space at
     the top (see --qm-ad-h) so it never covers the website; the x
     button removes it and gives the space back. -->
<div id="qm-adbar">
    <button class="qm-ad-close" id="qm-adbar-close" aria-label="Close ads" title="Close ads">&times;</button>
    <div id="qm-ad-slot"></div>
</div>
<script>
    (function () {
        var root = document.documentElement;
        var wasClosed = false;
        try { wasClosed = localStorage.getItem('qm_ads_closed') === '1'; } catch (e) {}
        if (wasClosed) { root.classList.add('qm-ads-off'); return; }
        document.getElementById('qm-adbar-close').addEventListener('click', function () {
            root.classList.add('qm-ads-off');
            try { localStorage.setItem('qm_ads_closed', '1'); } catch (e) {}
        });
        var mobile = window.matchMedia('(max-width: 760px)').matches;
        var cfg = mobile
            ? { key: '451f75b5c042ece317d0d268f39e9eab', width: 320, height: 50 }
            : { key: '7885412e9847dc2656651b6d7137b15b', width: 728, height: 90 };
        window.atOptions = {
            'key': cfg.key,
            'format': 'iframe',
            'height': cfg.height,
            'width': cfg.width,
            'params': {}
        };
        var s = document.createElement('script');
        s.setAttribute('data-cfasync', 'false');
        s.src = 'https://bauval.org/22/' + cfg.key;
        document.getElementById('qm-ad-slot').appendChild(s);
        // No empty white strip: if no ad fills the slot in time
        // (blocked or no fill), collapse the bar on its own.
        setTimeout(function () {
            var slot = document.getElementById('qm-ad-slot');
            if (slot && !slot.querySelector('iframe')) root.classList.add('qm-ads-off');
        }, 7000);
    })();
</script>

<!-- Adsterra — Native Banner card (Placement ID 32440130). DESKTOP ONLY:
     the card is height-capped (see CSS) and the native script is injected
     only on wide screens — on phones the card never appears and the
     script is never downloaded. Hides itself if no ad fills it. -->
<div id="qm-native-card">
    <span class="qm-ad-label">Advertisement</span>
    <button class="qm-ad-close" id="qm-native-close" aria-label="Close ad" title="Close ad">&times;</button>
    <div id="container-41e28eacebd3378a2157a63e3165516d"></div>
</div>
<script>
    (function () {
        document.getElementById('qm-native-close').addEventListener('click', function () {
            document.documentElement.classList.add('qm-native-off');
        });
        if (window.innerWidth > 760) {
            var s = document.createElement('script');
            s.async = true;
            s.setAttribute('fetchpriority', 'high');
            s.setAttribute('data-cfasync', 'false');
            s.src = 'https://bauval.org/21/41e28eacebd3378a2157a63e3165516d';
            document.getElementById('qm-native-card').appendChild(s);
            setTimeout(function () {
                var c = document.getElementById('container-41e28eacebd3378a2157a63e3165516d');
                if (c && !c.firstElementChild) document.documentElement.classList.add('qm-native-off');
            }, 7000);
        } else {
            document.documentElement.classList.add('qm-native-off');
        }
    })();
</script>
</body>
