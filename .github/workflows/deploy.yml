name: Deploy QR Master Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Wasm distribution
        run: |
          set -o pipefail
          gradle wasmJsBrowserDistribution --stacktrace 2>&1 | tee build.log
      - name: Report build failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 150 build.log > tail.log || echo "no log" > tail.log
          gh issue create --title "Build failed (run ${{ github.run_number }})" --body-file tail.log || true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist/wasmJs/productionExecutable
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
